name: Release

# Runs on every push to main. If package.json's version already has a matching
# `vX.Y.Z` git tag, this is a no-op (covers ordinary commits, and the version-bump
# commit itself before its tag exists). Otherwise — i.e. the "Version Packages" PR
# from version-pr.yml was just merged — it builds the card, tags the release, and
# publishes a GitHub Release with the built JS attached. HACS installs the plugin
# from that release asset, not from the repo tree, so this step is what actually
# ships a new version to users (see CLAUDE.md "Versioning & releases").

on:
  push:
    branches: [main]
    paths:
      - package.json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check whether this version is already released
        id: check
        run: |
          version="v$(node -p "require('./package.json').version")"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.already_released == 'false'
        run: npm ci

      - if: steps.check.outputs.already_released == 'false'
        run: npm run test

      - if: steps.check.outputs.already_released == 'false'
        run: npm run build

      - if: steps.check.outputs.already_released == 'false'
        name: Extract this version's CHANGELOG.md section
        id: notes
        run: |
          version="$(node -p "require('./package.json').version")"
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v header="## $version" '
            $0 == header { found = 1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.already_released == 'false'
        name: Tag and publish the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.check.outputs.tag }}"
          git push origin "${{ steps.check.outputs.tag }}"
          gh release create "${{ steps.check.outputs.tag }}" \
            dist/decluttering-selector.js \
            --title "${{ steps.check.outputs.tag }}" \
            --notes-file "${{ steps.notes.outputs.file }}"
